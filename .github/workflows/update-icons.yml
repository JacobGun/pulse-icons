name: Update Pulse icons

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-icons:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update icons
        run: npm run icons:update
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "ICO-10 update Pulse icons"
          branch: automation/update-pulse-icons
          delete-branch: true
          title: "ICO-10: Update Pulse icons"
          body: |
            Automated icon update from the Pulse Icons Figma library.

            Generated by the ICO-10 icon update workflow.